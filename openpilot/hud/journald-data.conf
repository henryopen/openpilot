# /etc/systemd/journald.conf.d/journald-data.conf - limits for the journal kept on /data (journal-data.service)
# Size only, no MaxRetentionSec: the device boots with its clock at the image's date (2026-07-28) and only later gets
# the real time, so every boot's journal starts "months old" - a retention limit deleted the previous boot's journal
# at the next boot (10/28: "Retention time reached, rotating").
[Journal]
SystemMaxUse=300M
SystemKeepFree=2G
