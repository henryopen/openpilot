# PiBar desktop panel, the user's copy (~/.config/wf-panel-pi/wf-panel-pi.ini). Same as /etc/xdg/wf-panel-pi/wf-panel-pi.ini
# but without the bluetooth and netman widgets (11/02): netman is NetworkManager's secret agent, so every time the LED
# card's handshake timed out (taken as a wrong key) it popped a wifi password dialog over the HUD kiosk - 4 times on
# the 11/02 drive - and bluetooth is the pairing-PIN agent. The passwords are stored system-wide, the keypad is paired
# and trusted, so neither needs a dialog. Pair a new bluetooth device with bluetoothctl.
# Install: cp wf-panel-pi.ini ~/.config/wf-panel-pi/wf-panel-pi.ini, then kill the wf-panel-pi PID (lwrespawn restarts it)
[panel]
widgets_left=smenu spacing0 spacing4 launchers spacing8 window-list
widgets_center=
widgets_right=tray power ejecter updater spacing2 connect spacing2 volumepulse spacing2 clock spacing2 batt spacing2 squeek
launchers=x-www-browser pcmanfm x-terminal-emulator
position=top
icon_size=32
window-list_max_width=200
